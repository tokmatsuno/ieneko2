name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify answer-built cats
        run: |
          node --check version.js
          node --check app.js
          node --check cat-studio.js
          node --check quests.js
          node --check journey-model.js
          node --check opendata-core.js
          node --check map-data-client.js
          node --check ienekomap2/map.js
          node scripts/build-cat-data.cjs --check
          node scripts/build-map-service.cjs --check
          node tests/cat-data.test.cjs
          node tests/cat-studio.test.cjs
          node tests/continuous.test.cjs
          node tests/opendata.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
