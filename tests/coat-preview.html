<!doctype html><html lang="ja"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原画の毛並みの確認</title><style>body{margin:24px;background:#f6f0e3;color:#23483b;font:14px sans-serif}h1{font-size:22px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{padding:15px;background:#e4e4d7;border:1px solid #cdbb91;border-radius:15px;text-align:center}img{width:100%;height:300px;object-fit:contain}b{display:block;margin:8px}p{font-size:12px}</style><h1>前バージョンの原画で変える、毛色と模様</h1><p>原画の輪郭・毛並み・顔立ちをそのまま使っています。</p><main id="samples"></main><script src="journey-model.js?v=2.12"></script><script src="cat-studio.js?v=2.12"></script><script>
const qs=Array.from({length:5},()=>({answers:Array.from({length:3},()=>({x:5,y:5}))}));
for(const [name,path] of [['白猫',[0,0,0,0,0]],['黒猫',[1,0,0,0,0]],['三毛猫',[0,2,0,0,0]],['茶猫',[2,0,0,0,0]],['白黒ぶち猫',[0,1,1,1,1]],['茶トラ猫',[2,2,1,1,2]]]){
 const a=CatStudio.derive(path.map(choice=>({choice})),qs),article=document.createElement('article'),img=new Image();article.innerHTML=`<b>${name}</b>`;article.prepend(img);img.alt=name;document.querySelector('main').append(article);CatStudio.render(a,'hello',600).then(src=>img.src=src);
}
for(const [name,weights]of [['白60・黒20・茶20の回答',[.6,.2,.2]],['3つを同じくらいの回答',[1/3,1/3,1/3]]]){const a=CatStudio.derive([{weights}],qs),article=document.createElement('article'),img=new Image();article.innerHTML=`<b>${name}</b>`;article.prepend(img);img.alt=name;document.querySelector('main').append(article);CatStudio.render(a,'hello',600).then(src=>img.src=src);}
</script><footer style="margin-top:25px;line-height:1.8">2026年度東京大学シビックテックデザイン学講座Team 1 · <span id="sampleVersion">ver2.12</span></footer><script src="version.js?v=2.12"></script><script>document.querySelector("#sampleVersion").textContent="ver"+window.IENEKO_RELEASE.version;</script></html>
